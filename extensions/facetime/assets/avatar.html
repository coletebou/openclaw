<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avatar</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #04050b;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      // Plays avatar-loop.mp4 and lights it with the agent's voice. Each video frame stacks two
      // pictures of the same moment: the dim head on top, and only the light it emits below.
      // The shader adds the lower picture to the upper one in proportion to the voice level,
      // so the head glows from inside instead of the whole frame getting brighter.
      (function () {
        "use strict";

        // ---------- configuration ----------
        var query = new URLSearchParams(location.search);
        function clamp(v, lo, hi) {
          return v < lo ? lo : v > hi ? hi : v;
        }
        var DEMO = query.get("demo") === "1";
        var OFFSET_MS = (function () {
          var n = parseInt(query.get("offsetMs"), 10);
          return isFinite(n) ? clamp(n, -1000, 1000) : 0;
        })();

        // ---------- voice level schedule ----------
        var segs = []; // {at, hop, n, f: Float32Array} in epoch ms; later entries win
        var scheduledFrames = 0;
        var clockOffset = 0;
        var MAX_FUTURE_MS = 30000;
        var MAX_SEGS = 512;

        function epochNow() {
          return Date.now() + clockOffset;
        }

        // Interpolated level at epoch time t, or 0 when nothing is scheduled there.
        function levelAt(t) {
          for (var k = segs.length - 1; k >= 0; k--) {
            var s = segs[k];
            var x = (t - s.at) / s.hop;
            if (x < 0 || x >= s.n) continue;
            var i = Math.floor(x),
              j = i + 1 < s.n ? i + 1 : i;
            return s.f[i] + (s.f[j] - s.f[i]) * (x - i);
          }
          return 0;
        }

        function pruneSchedule(t) {
          var live = [];
          scheduledFrames = 0;
          for (var k = Math.max(0, segs.length - MAX_SEGS); k < segs.length; k++) {
            var s = segs[k];
            if (s.at + s.n * s.hop > t - 100) {
              live.push(s);
              scheduledFrames += s.n;
            }
          }
          segs = live;
        }

        function addSpeak(msg) {
          var at = Number(msg.at),
            hop = Number(msg.hopMs),
            raw = msg.levels;
          if (!isFinite(at) || !isFinite(hop) || hop <= 0 || !Array.isArray(raw)) return;
          hop = clamp(hop, 5, 200);
          var t = epochNow() - OFFSET_MS; // compare in "frame time"; the trim is applied at lookup
          var first = Math.max(0, Math.floor((t - at) / hop)); // drop levels already in the past
          var last = Math.min(raw.length, Math.floor((t + MAX_FUTURE_MS - at) / hop) + 1);
          if (last <= first) return;
          var f = new Float32Array(last - first);
          for (var i = first; i < last; i++) {
            var v = Number(raw[i]);
            f[i - first] = clamp(isFinite(v) ? v / 100 : 0, 0, 1);
          }
          segs.push({ at: at + first * hop, hop: hop, n: last - first, f: f });
          scheduledFrames += last - first;
        }

        function clearSchedule() {
          segs = [];
          scheduledFrames = 0;
        }

        // ---------- state ----------
        var state = {
          call: "idle",
          active: 0, // eased 0..1 version of call
          level: 0, // the voice, fast: drives the light
          swell: 0, // the voice, slow: drives the push-in and the haze
          connected: false,
          video: "loading",
        };

        function setCall(v) {
          if (v === "idle" || v === "active") state.call = v;
        }

        Object.defineProperty(window, "__avatarDebug", {
          value: function () {
            return {
              call: state.call,
              level: state.level,
              scheduled: scheduledFrames,
              connected: state.connected,
              video: state.video,
            };
          },
        });

        // ---------- feed ----------
        function handleMessage(data) {
          var m;
          try {
            m = JSON.parse(data);
          } catch (e) {
            return;
          }
          if (!m || typeof m !== "object") return;
          switch (m.type) {
            case "hello":
              if (isFinite(Number(m.now))) clockOffset = Number(m.now) - Date.now();
              setCall(m.call);
              break;
            case "call":
              setCall(m.state);
              break;
            case "speak":
              addSpeak(m);
              break;
            case "clear":
              clearSchedule();
              break;
          }
        }

        var served = location.protocol === "http:" || location.protocol === "https:";

        function startFeed() {
          if (!served) return; // e.g. file://: nothing to connect to
          var url =
            (location.protocol === "https:" ? "wss://" : "ws://") +
            location.host +
            location.pathname;
          var backoff = 500,
            warned = false;
          function retry() {
            state.connected = false;
            setTimeout(connect, backoff);
            backoff = Math.min(backoff * 2, 5000);
          }
          function connect() {
            var ws;
            try {
              ws = new WebSocket(url);
            } catch (e) {
              retry();
              return;
            }
            ws.onopen = function () {
              backoff = 500;
              state.connected = true;
            };
            ws.onmessage = function (ev) {
              handleMessage(ev.data);
            };
            ws.onerror = function () {
              if (!warned) {
                warned = true;
                console.warn("avatar: feed unavailable, retrying");
              }
            };
            ws.onclose = retry;
          }
          connect();
        }

        // Believable looping speech for placing the source without a call; goes through addSpeak.
        var demoEnd = 0;
        function demoFeed() {
          var now = epochNow();
          if (demoEnd > now + 1500) return;
          var start = demoEnd ? demoEnd + 500 + Math.random() * 1100 : now + 100;
          var levels = [],
            syllables = 6 + Math.floor(Math.random() * 7);
          for (var s = 0; s < syllables; s++) {
            var amp = 0.55 + Math.random() * 0.45;
            var len = 5 + Math.floor(Math.random() * 6);
            for (var k = 0; k < len; k++) {
              var env = Math.pow(Math.sin((Math.PI * (k + 0.5)) / len), 0.7);
              levels.push(Math.round(Math.max(8, amp * env * 100)));
            }
            if (Math.random() < 0.6) levels.push(5);
          }
          addSpeak({ at: start, hopMs: 20, levels: levels });
          demoEnd = start + levels.length * 20;
        }

        // ---------- the loop video ----------
        var video = document.createElement("video");
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "auto";
        video.addEventListener("playing", function () {
          state.video = "playing";
        });
        video.addEventListener("error", function () {
          state.video = "error";
          console.warn("avatar: the loop video could not be played");
        });
        function play() {
          var started = video.play();
          if (started && started.catch) started.catch(function () {});
        }
        function startVideo() {
          // Held in memory as one blob, so each loop restarts without asking the Gateway again.
          fetch(location.pathname.replace(/\/$/, "") + "/loop.mp4")
            .then(function (res) {
              if (!res.ok) throw new Error("HTTP " + res.status);
              return res.blob();
            })
            .then(function (blob) {
              video.src = URL.createObjectURL(blob);
              play();
            })
            .catch(function (err) {
              state.video = "error";
              console.warn("avatar: the loop video could not be loaded: " + err.message);
            });
        }

        // ---------- drawing ----------
        var canvas = document.getElementById("c");
        var gl = canvas.getContext("webgl", { alpha: false, antialias: false });
        var uniforms = {};
        var VIDEO_ASPECT = 16 / 9;

        function setupGl() {
          if (!gl) {
            console.warn("avatar: WebGL is unavailable");
            return;
          }
          function shader(type, source) {
            var sh = gl.createShader(type);
            gl.shaderSource(sh, source);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
              console.warn("avatar: " + gl.getShaderInfoLog(sh));
            }
            return sh;
          }
          var program = gl.createProgram();
          gl.attachShader(
            program,
            shader(
              gl.VERTEX_SHADER,
              "attribute vec2 p; varying vec2 v; void main(){ v = p * 0.5 + 0.5; gl_Position = vec4(p, 0., 1.); }",
            ),
          );
          gl.attachShader(
            program,
            shader(
              gl.FRAGMENT_SHADER,
              [
                "precision highp float;",
                "varying vec2 v;",
                "uniform sampler2D uVideo;",
                "uniform vec2 uFit;",
                "uniform float uLevel, uSwell, uActive, uTime, uReady, uAspect;",
                // The frame is flipped on upload, so the base picture is the upper half in v.
                // Half a texel of margin keeps the two pictures from bleeding into each other.
                "vec3 base(vec2 uv){ return texture2D(uVideo, vec2(uv.x, 0.5 + clamp(uv.y, 0.001, 0.999) * 0.5)).rgb; }",
                "vec3 light(vec2 uv){ return texture2D(uVideo, vec2(uv.x, clamp(uv.y, 0.001, 0.999) * 0.5)).rgb; }",
                "float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }",
                "void main(){",
                // cover the canvas, and push in a little while the voice swells
                "  vec2 uv = 0.5 + (v - 0.5) * uFit / (1. + 0.022 * uSwell);",
                "  vec3 b = base(uv);",
                // the emitted light splits slightly by colour on loud syllables
                "  float ca = 0.0016 * uLevel;",
                "  vec3 e = vec3(light(uv + vec2(ca, 0.)).r, light(uv).g, light(uv - vec2(ca, 0.)).b);",
                // idle: none. On a call: an ember. Speaking: lit by the voice.
                "  float gain = uActive * (0.1 + 0.05 * uSwell) + uLevel;",
                "  float lum = dot(e, vec3(0.3, 0.6, 0.1));",
                // where the light is strong it replaces the cool base instead of washing it out
                "  vec3 c = b * (0.6 + 0.4 * uActive) * (1. - min(1., 1.35 * gain * lum)) + e * gain;",
                // the haze the light throws around the head, computed here so it cannot band
                "  vec2 q = (uv - vec2(0.5, 0.7)) * vec2(16. / 9., 1.);",
                "  float r2 = dot(q, q);",
                "  c += vec3(1., 0.45, 0.16) * gain * (0.1 * exp(-r2 / 0.09) + 0.03 * exp(-r2 / 0.6));",
                // until the loop plays, or if this build has none, a plain glow stands in
                "  vec2 o = (v - 0.5) * vec2(uAspect, 1.);",
                "  float d2 = dot(o, o);",
                "  vec3 orb = vec3(0.1, 0.24, 0.7) * (0.3 + 0.3 * uActive) * exp(-d2 / 0.05)",
                "    + vec3(1., 0.5, 0.18) * gain * (0.9 * exp(-d2 / 0.02) + 0.25 * exp(-d2 / 0.2));",
                "  c = mix(orb, c, uReady);",
                // a touch of grain hides banding in the dark gradients
                "  c += (hash(gl_FragCoord.xy + fract(uTime) * 61.7) - 0.5) * 0.014;",
                "  gl_FragColor = vec4(c, 1.);",
                "}",
              ].join("\n"),
            ),
          );
          gl.linkProgram(program);
          gl.useProgram(program);
          ["uVideo", "uFit", "uLevel", "uSwell", "uActive", "uTime", "uReady", "uAspect"].forEach(
            function (n) {
              uniforms[n] = gl.getUniformLocation(program, n);
            },
          );
          gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
          var loc = gl.getAttribLocation(program, "p");
          gl.enableVertexAttribArray(loc);
          gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
          gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
          gl.uniform1i(uniforms.uVideo, 0);
        }

        function resize() {
          // The video is 1080 lines tall: a larger canvas would only cost fill rate.
          var scale = Math.min(
            window.devicePixelRatio || 1,
            1080 / Math.max(1, window.innerHeight),
          );
          var w = Math.max(1, Math.round(window.innerWidth * scale));
          var h = Math.max(1, Math.round(window.innerHeight * scale));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w;
            canvas.height = h;
          }
        }

        var ready = 0;
        var hasFrame = false;
        function draw(t, dt) {
          if (!gl) return;
          if (video.readyState >= 2) {
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
            hasFrame = true;
          }
          if (hasFrame) ready += (1 - ready) * (1 - Math.exp(-dt / 400)); // fade the loop in
          var aspect = canvas.width / canvas.height;
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.uniform2f(
            uniforms.uFit,
            Math.min(1, aspect / VIDEO_ASPECT),
            Math.min(1, VIDEO_ASPECT / aspect),
          );
          gl.uniform1f(uniforms.uLevel, state.level);
          gl.uniform1f(uniforms.uSwell, state.swell);
          gl.uniform1f(uniforms.uActive, state.active);
          gl.uniform1f(uniforms.uTime, t / 1000);
          gl.uniform1f(uniforms.uReady, ready);
          gl.uniform1f(uniforms.uAspect, aspect);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }

        function update(dt) {
          var now = epochNow() - OFFSET_MS;
          pruneSchedule(now);
          var target = levelAt(now);
          // light rises with a syllable at once and lingers a moment after it
          state.level +=
            (target - state.level) * (1 - Math.exp(-dt / (target > state.level ? 35 : 170)));
          state.swell += (state.level - state.swell) * (1 - Math.exp(-dt / 450));
          var act = state.call === "active" ? 1 : 0;
          state.active += (act - state.active) * (1 - Math.exp(-dt / 500));
        }

        var last = 0;
        function frame(ts) {
          var dt = last ? Math.min(ts - last, 100) : 16;
          last = ts;
          if (DEMO) demoFeed();
          update(dt);
          draw(ts, dt);
          requestAnimationFrame(frame);
        }

        window.addEventListener("resize", resize);
        if (DEMO) setCall("active");
        else startFeed();
        setupGl();
        resize();
        startVideo();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
